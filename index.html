<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripMate - Du lịch nhóm thông minh & Lập lịch trình AI</title>
    <meta name="description" content="Ứng dụng đồng hành du lịch nhóm thông minh, lên lịch trình bằng AI, khám phá địa điểm, chia sẻ ngân sách và cá nhân hóa tiện ích với chế độ Dark Mode." />
    <meta property="og:title" content="TripMate - Du lịch nhóm thông minh & Lập lịch trình AI" />
    <meta property="og:description" content="Ứng dụng đồng hành du lịch nhóm thông minh, lên lịch trình bằng AI, khám phá địa điểm, chia sẻ ngân sách và cá nhân hóa tiện ích với chế độ Dark Mode." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tripmate_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
